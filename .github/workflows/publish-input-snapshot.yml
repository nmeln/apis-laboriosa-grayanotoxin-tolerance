name: Publish input snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-input-snapshot.yml
      - data_sources.tsv
      - input_snapshot.sha256
      - scripts/create_input_snapshot.py
      - scripts/fetch_inputs.py

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: make setup
      - name: Fetch from official repositories
        run: .venv/bin/python scripts/fetch_inputs.py --official-only
      - name: Build deterministic archive
        run: >-
          .venv/bin/python scripts/create_input_snapshot.py
          --output /tmp/apis-laboriosa-inputs-v1.tar
      - name: Verify archive hash
        working-directory: /tmp
        run: sha256sum -c "$GITHUB_WORKSPACE/input_snapshot.sha256"
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=input-snapshot-v1
          asset=/tmp/apis-laboriosa-inputs-v1.tar
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --title "Input snapshot v1" \
              --notes "Exact inputs for the committed analysis. Source terms and citations are in THIRD_PARTY_DATA.md."
          fi
