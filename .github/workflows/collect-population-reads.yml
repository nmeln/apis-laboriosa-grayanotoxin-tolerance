name: Collect ABCC population reads

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'all, or comma-separated deposited SRR accessions'
        required: true
        default: all
      prior_run:
        description: 'Optional earlier collection run to merge; requires all 57 workers in the final artifact'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: population-read-collection-${{ inputs.prior_run || 'initial' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.matrix.outputs.runs }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          REQUESTED_RUNS: ${{ inputs.runs }}
        run: |
          python - <<'PY'
          import csv, json, os
          with open('population_addendum/results/sample_inventory.tsv') as f:
              available = sorted(r['run_accession'] for r in csv.DictReader(f, delimiter='\t'))
          requested = os.environ['REQUESTED_RUNS'].strip()
          selected = available if requested == 'all' else sorted(set(requested.split(',')))
          assert selected and set(selected) <= set(available), 'Unknown accession'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('runs=' + json.dumps(selected) + '\n')
          PY
  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        run: ${{ fromJson(needs.plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned capture tool
        run: |
          python -m pip install zstandard==0.25.0
          python population_addendum/scripts/setup_tools.py
      - name: Download complete source files with bounded parallel transfers
        env:
          SAMPLE_RUN: ${{ matrix.run }}
        run: python population_addendum/scripts/download_parallel.py --run "$SAMPLE_RUN" --connections 4
      - name: Verify complete FASTQs and retain candidate pairs
        env:
          SAMPLE_RUN: ${{ matrix.run }}
        run: python population_addendum/scripts/collect_reads.py --run "$SAMPLE_RUN" --delete-raw
      - name: Preserve selected read pairs and capture log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: population-${{ matrix.run }}
          path: population_addendum/inputs/selected_reads/
          retention-days: 30
          compression-level: 6
          overwrite: true
  gather:
    needs: [plan, collect]
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: population-SRR*
          path: population_addendum/work/current_batch
          merge-multiple: true
      - name: Retrieve earlier completed libraries
        if: inputs.prior_run != ''
        uses: actions/download-artifact@v4
        with:
          pattern: population-SRR*
          path: population_addendum/work/prior_batch
          merge-multiple: true
          run-id: ${{ inputs.prior_run }}
          github-token: ${{ github.token }}
      - name: Check and merge all expected libraries
        env:
          REQUESTED_RUNS: ${{ inputs.runs }}
          PRIOR_RUN: ${{ inputs.prior_run }}
        run: |
          expected="$REQUESTED_RUNS"
          if [ -n "$PRIOR_RUN" ]; then expected=all; fi
          python population_addendum/scripts/gather_evidence.py --source population_addendum/work/prior_batch --source population_addendum/work/current_batch --destination population_addendum/work/gathered --expected "$expected"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: population-evidence-all
          path: population_addendum/work/gathered/
          retention-days: 30
          compression-level: 6
          overwrite: true
