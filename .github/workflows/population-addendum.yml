name: Reproduce ABCC population analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore exact inputs and reproduce all population results
        run: make -C population_addendum all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduced-population-results
          path: |
            population_addendum/results/
            population_addendum/work/population/*.log
            population_addendum/work/population/*.mapping_summary.json
            population_addendum/work/population/*.duplicates.txt
          retention-days: 30
